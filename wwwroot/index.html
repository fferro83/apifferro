<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Utility Asset AI Dashboard</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Your custom overrides -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">⚡ Utility Asset AI Dashboard</span>
        </div>
    </nav>

    <main class="container">
        <div class="row g-4">

            <!-- Predict card -->
            <div class="col-md-6">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title">Predict Maintenance Need</h5>
                        <form id="predictForm">
                            <div class="mb-2">
                                <label class="form-label">Asset ID</label>
                                <input type="text" class="form-control" id="assetId" value="A001" required>
                            </div>
                            <div class="mb-2">
                                <label class="form-label">Asset Type</label>
                                <select class="form-select" id="assetType">
                                    <option>Pole</option>
                                    <option>Transformer</option>
                                    <option>Meter</option>
                                </select>
                            </div>
                            <div class="row">
                                <div class="col mb-2">
                                    <label class="form-label">Latitude</label>
                                    <input type="number" step="any" class="form-control" id="latitude" value="37.9101" required>
                                </div>
                                <div class="col mb-2">
                                    <label class="form-label">Longitude</label>
                                    <input type="number" step="any" class="form-control" id="longitude" value="-122.0652" required>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col mb-2">
                                    <label class="form-label">Age (years)</label>
                                    <input type="number" class="form-control" id="ageYears" value="15" required>
                                </div>
                                <div class="col mb-3">
                                    <label class="form-label">Last Inspection (months ago)</label>
                                    <input type="number" class="form-control" id="lastInspection" value="24" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Predict</button>
                        </form>
                        <div id="predictResult" class="alert alert-secondary mt-3 mb-0 d-none"></div>
                    </div>
                </div>
            </div>

            <!-- Image classify card -->
            <div class="col-md-6">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title">Classify Asset Photo</h5>
                        <form id="imageForm">
                            <div class="mb-2">
                                <label class="form-label">Expected Asset Type</label>
                                <select class="form-select" id="expectedAssetType">
                                    <option value="">Show all detections</option>
                                    <option value="pole">Pole</option>
                                    <option value="transformer">Transformer</option>
                                    <option value="meter">Meter</option>
                                    <option value="substation">Substation</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <input type="file" class="form-control" id="imageFile" accept="image/*" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Classify</button>
                        </form>
                        <div class="mb-3">
                            <canvas id="imageCanvas" class="img-fluid rounded border d-none" style="max-width: 100%;"></canvas>
                        </div>
                        <div id="imageResult" class="alert alert-secondary mt-3 mb-0 d-none"></div>
                        <div id="detectionsList" class="mt-3"></div>
                    </div>
                </div>
            </div>

            <!-- Map card -->
            <div class="col-12">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Asset Map</h5>
                        <div id="map" class="rounded"></div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <footer class="text-center text-muted py-4 mt-4">
        Utility Asset AI - Epik Solutions
    </footer>

    <!-- Bootstrap JS (for future components like modals/dropdowns) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
