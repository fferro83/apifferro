<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Utility Asset AI Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body {
            background-color: #f5f7fa;
        }

        .navbar-brand {
            font-weight: 600;
            font-size: 1.4rem;
        }

        .dashboard-title {
            font-size: 1.8rem;
            font-weight: 600;
            color: #0d6efd;
        }

        .card {
            border: none;
            border-radius: 12px;
        }

        .card-title {
            font-weight: 600;
            color: #0d6efd;
        }

        #map {
            height: 400px;
        }

        .form-label {
            font-weight: 500;
        }

        .result-box {
            font-size: 1rem;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container">
            <span class="navbar-brand">⚡ Utility Asset AI Dashboard</span>
        </div>
    </nav>

    <main class="container py-4">

        <div class="mb-4">
            <div class="dashboard-title">AI‑Powered Utility Asset Insights</div>
            <p class="text-muted">Predict maintenance needs, classify asset photos, and visualize assets on the map.</p>
        </div>

        <div class="row g-4">

            <!-- Predict Card -->
            <div class="col-lg-6">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title mb-3">🔧 Predict Maintenance Need</h5>

                        <form id="predictForm">
                            <div class="mb-3">
                                <label class="form-label">Asset ID</label>
                                <input type="text" class="form-control" id="assetId" value="A001" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Asset Type</label>
                                <select class="form-select" id="assetType">
                                    <option>Pole</option>
                                    <option>Transformer</option>
                                    <option>Meter</option>
                                </select>
                            </div>

                            <div class="row">
                                <div class="col mb-3">
                                    <label class="form-label">Latitude</label>
                                    <input type="number" step="any" class="form-control" id="latitude" value="37.9101" required>
                                </div>
                                <div class="col mb-3">
                                    <label class="form-label">Longitude</label>
                                    <input type="number" step="any" class="form-control" id="longitude" value="-122.0652" required>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col mb-3">
                                    <label class="form-label">Age (years)</label>
                                    <input type="number" class="form-control" id="ageYears" value="15" required>
                                </div>
                                <div class="col mb-3">
                                    <label class="form-label">Last Inspection (months ago)</label>
                                    <input type="number" class="form-control" id="lastInspection" value="24" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">Run Prediction</button>
                        </form>

                        <div id="predictResult" class="alert alert-info mt-3 result-box d-none"></div>
                    </div>
                </div>
            </div>

            <!-- Image Classify Card -->
            <div class="col-lg-6">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title mb-3">📸 Classify Asset Photo</h5>

                        <form id="imageForm">
                            <div class="mb-3">
                                <label class="form-label">Expected Asset Type</label>
                                <select class="form-select" id="expectedAssetType">
                                    <option value="">Show all detections</option>
                                    <option value="pole">Pole</option>
                                    <option value="transformer">Transformer</option>
                                    <option value="meter">Meter</option>
                                    <option value="substation">Substation</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <input type="file" class="form-control" id="imageFile" accept="image/*" required>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">Analyze Photo</button>
                        </form>

                        <canvas id="imageCanvas" class="img-fluid rounded border d-none mt-3"></canvas>

                        <div id="imageResult" class="alert alert-info mt-3 result-box d-none"></div>
                        <div id="detectionsList" class="mt-3"></div>
                    </div>
                </div>
            </div>

            <!-- Map Card -->
            <div class="col-12">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title mb-3">🗺️ Asset Map</h5>
                        <div id="map" class="rounded"></div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <footer class="text-center text-muted py-4">
        Utility Asset AI — Epik Solutions
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
